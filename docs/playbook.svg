<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 684" width="1200" height="684" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">jev-gtm-playbook: 14 GTM playbooks across the customer lifecycle</title>
<desc id="d">Fourteen playbooks, plus list import and enrichment, placed on the seven customer lifecycle stages in order: awareness, education, selection, mutual commit, onboarding, retention and expansion. Awareness has three, education six and selection six. Mutual commit, onboarding, retention and expansion have none yet. Every playbook runs the same five steps: code filters, Jev judges, code checks, an LLM writes, code acts. Run live on 54 cases for a tenth of a cent, with 53 of 54 matching the saved answers; re-running makes no calls.</desc>
