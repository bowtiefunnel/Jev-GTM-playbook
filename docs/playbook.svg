<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">jev-gtm-playbook: 14 GTM playbooks on one spine</title>
<desc id="d">Fourteen playbooks, plus list import and enrichment, grouped by outbound stage: who to reach, when, what to say, after they answer, and learning what works. Every playbook runs the same five steps: code filters, Jev judges, code checks, an LLM writes, code acts. Run live on 54 cases for a tenth of a cent, with 53 of 54 matching the saved answers; re-running makes no calls.</desc>
