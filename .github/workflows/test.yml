name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run demo
      - run: node src/trace.js
      - run: node src/docs.js
      - run: for n in 01 02 03 04 05 06 07 08 09 10 11 12 14 15; do node src/cli.js replay "$n" > /dev/null; done
